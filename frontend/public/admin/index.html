<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Hey Pop Chips</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-testid="page-admin-login">
  <div class="admin-login">
    <div class="admin-login-card">
      <div class="logo">
        <span class="logo-mark"><i class="fa-solid fa-bolt"></i></span>
        <span>Hey Pop<span style="color:var(--secondary)">.</span></span>
      </div>
      <h2>Admin Panel</h2>
      <p>Sign in to manage products, stores, and more.</p>
      <form id="admin-login" data-testid="admin-login-form">
        <div class="input-group" style="margin-bottom:16px;">
          <label>Email</label>
          <input type="email" class="input" required placeholder="admin@heypopchips.com" data-testid="login-email" value="admin@heypopchips.com" />
        </div>
        <div class="input-group" style="margin-bottom:24px;">
          <label>Password</label>
          <input type="password" class="input" required placeholder="••••••••" data-testid="login-password" value="popadmin" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;" data-testid="login-submit">
          Sign in <i class="fa-solid fa-arrow-right"></i>
        </button>
        <div id="login-status" style="margin-top:12px;font-size:.85rem;color:var(--text-soft);text-align:center;" data-testid="login-status">
          Demo credentials are pre-filled. Auth handled by your PHP backend.
        </div>
      </form>
      <div style="text-align:center;margin-top:24px;">
        <a href="/" style="font-size:.85rem;color:var(--text-soft);">← Back to site</a>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('admin-login').addEventListener('submit', (e) => {
      e.preventDefault();
      sessionStorage.setItem('hpc_admin', '1');
      window.location.href = '/admin/dashboard.html';
    });
  </script>
</body>
</html>
